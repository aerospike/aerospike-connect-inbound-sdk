# Builds, signs, and publishes the SDK to JFrog, then promotes the bundle to DEV.
#
# USAGE:
#   1. Merge stage into master when you are ready to cut a candidate
#   2. Push a unique -N tag, or run this workflow and enter the version
#   3. Consume the DEV Maven repo from a downstream project
#   4. Promote TEST then STAGE with the "Promote SDK release bundle" workflow
#
# Each JFrog bundle version is immutable. Every release uses a new -N suffix on
# the logical version from gradle.properties. Bundle, tag, and Maven GAV share the
# same version (for example, 1.4.5-1). Bundles are annotated with the logical
# version so attempts for the same line stay grouped.
#
# VERSION EXAMPLES (gradle.properties version=1.4.5):
#   1.4.5-1 -> bundle, tag, and Maven/JAR 1.4.5-1; annotate 1.4.5
#   1.4.5-2 -> bundle, tag, and Maven/JAR 1.4.5-2; annotate 1.4.5
#
name: Build SDK release to DEV

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Release version with required -N suffix (for example, 1.4.5-1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# One release at a time. Do not cancel an in-progress deploy/promotion.
concurrency:
  group: sdk-release
  cancel-in-progress: false

env:
  BUNDLE_NAME: aerospike-connect-inbound-sdk

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      annotate-tag: ${{ steps.version.outputs.annotate-tag }}
      maven-version: ${{ steps.version.outputs.maven-version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION:-${GITHUB_REF_NAME}}"
          version="${version#v}"
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "Invalid release version: $version" >&2
            echo "Use X.Y.Z-N (for example, 1.4.5-1)." >&2
            exit 1
          fi
          logical_version="${BASH_REMATCH[1]}"
          build_number=$((10#${BASH_REMATCH[2]}))
          if (( build_number < 1 )); then
            echo "Build number N must be at least 1 in $version" >&2
            exit 1
          fi
          release_version="${logical_version}-${build_number}"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "annotate-tag=$logical_version" >> "$GITHUB_OUTPUT"
          echo "maven-version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Release version: $release_version"
          echo "Annotation tag: $logical_version"

  build-sign-deploy:
    name: Build, sign, and deploy
    needs: release-metadata
    uses: aerospike/shared-workflows/.github/workflows/reusable_artifacts-cicd.yaml@7c8b65df2568974435ab8b40c9e9de6eae13b3bb # main, includes shared-workflows#293
    with:
      gh-workflows-ref: 7c8b65df2568974435ab8b40c9e9de6eae13b3bb
      gh-artifact-directory: dist
      jf-project: connect
      jf-build-name: aerospike-connect-inbound-sdk
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      version: ${{ needs.release-metadata.outputs.version }}
      build-type: release
      jar-group-id: com.aerospike
      setup-java: true
      java-cache: gradle
      build-env: BUNDLE_VERSION=${{ needs.release-metadata.outputs.version }};MAVEN_VERSION=${{ needs.release-metadata.outputs.maven-version }};LOGICAL_VERSION=${{ needs.release-metadata.outputs.annotate-tag }};SNYK_TOKENS=unused
      build-script: |
        set -euo pipefail
        gradle_version=$(grep '^version=' gradle.properties | cut -d= -f2)
        if [[ "$LOGICAL_VERSION" != "$gradle_version" ]]; then
          echo "gradle.properties version ($gradle_version) must match bundle logical version ($LOGICAL_VERSION)" >&2
          exit 1
        fi
        ./gradlew --no-daemon \
          -Pversion="$MAVEN_VERSION" \
          clean build sourcesJar javadocJar \
          generatePomFileForMavenJavaPublication \
          generateMetadataFileForMavenJavaPublication

        mkdir -p dist
        # The sources and javadoc jars have no sibling POM, so deploy-artifacts
        # reads their coordinates from the Maven descriptor that the build
        # embeds (see PublishingExtensions.embedMavenDescriptor). Without it
        # they are stored outside the GAV of the main artifact.
        cp build/libs/*.jar dist/
        cp build/publications/mavenJava/pom-default.xml \
          "dist/aerospike-connect-inbound-sdk-${MAVEN_VERSION}.pom"
        # deploy-artifacts picks up stem-based Maven companions, so the Gradle
        # Module Metadata file must share the JAR stem.
        cp build/publications/mavenJava/module.json \
          "dist/aerospike-connect-inbound-sdk-${MAVEN_VERSION}.module"
        ls -la dist
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  create-release-bundle:
    name: Create release bundle
    needs:
      - release-metadata
      - build-sign-deploy
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@7c8b65df2568974435ab8b40c9e9de6eae13b3bb # main, includes shared-workflows#293
    with:
      gh-workflows-ref: 7c8b65df2568974435ab8b40c9e9de6eae13b3bb
      jf-project: connect
      jf-build-names: ${{ needs.build-sign-deploy.outputs.jf-build-name }}:${{ needs.build-sign-deploy.outputs.jf-build-id }}
      jf-bundle-name: aerospike-connect-inbound-sdk
      version: ${{ needs.release-metadata.outputs.version }}

  promote-to-dev:
    name: Annotate and promote to DEV
    needs:
      - release-metadata
      - create-release-bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Set up JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          # The JFrog CLI action has no default URL, unlike the reusable
          # workflows, so this job sets the platform URL explicitly.
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: connect
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Annotate logical version
        env:
          BUNDLE_VERSION: ${{ needs.release-metadata.outputs.version }}
          ANNOTATE_TAG: ${{ needs.release-metadata.outputs.annotate-tag }}
        run: |
          set -euo pipefail
          echo "Annotating ${{ env.BUNDLE_NAME }}/${BUNDLE_VERSION} with tag ${ANNOTATE_TAG}"
          jf release-bundle-annotate "${{ env.BUNDLE_NAME }}" \
            "$BUNDLE_VERSION" \
            --project=connect \
            --tag="$ANNOTATE_TAG"

      - name: Promote to DEV
        uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@7c8b65df2568974435ab8b40c9e9de6eae13b3bb # main, includes shared-workflows#293
        with:
          bundle-name: ${{ env.BUNDLE_NAME }}
          version: ${{ needs.release-metadata.outputs.version }}
          environment: DEV
          jf-project: connect
