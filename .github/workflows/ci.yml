name: CI

on:
  push:
  pull_request:
    branches:
      - master
      - stage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SDK
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build SDK
        run: ./gradlew --no-daemon clean build

      - name: Check dependency upgrades
        run: >-
          ./gradlew --no-daemon dependencyUpdates
          -Drevision=release
          -DgradleReleaseChannel=current
          -DoutputFormatter=html
          --no-parallel
          --warning-mode=all

      - name: Upload build reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          if-no-files-found: warn
          retention-days: 5
          path: |
            **/build/test-results/**/*.xml
            **/build/dependencyUpdates/*
            **/build/libs/**/*.jar
            **/build/distributions/*
            **/build/reports/**/*

  snyk:
    name: Scan dependencies with Snyk
    runs-on: ubuntu-22.04
    env:
      SNYK_TOKENS: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Scan dependencies with Snyk
        if: env.SNYK_TOKENS != ''
        run: ./gradlew --no-daemon snyk-test

  examples:
    name: Build examples
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build JMS example
        run: mvn -B -Dstyle.color=never -f examples/jms -U clean install

      - name: Build Kafka example
        run: mvn -B -Dstyle.color=never -f examples/kafka clean install

      - name: Build Pulsar example
        run: mvn -B -Dstyle.color=never -f examples/pulsar clean install
