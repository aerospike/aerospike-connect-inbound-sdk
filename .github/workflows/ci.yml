name: CI

on:
  push:
  pull_request:
    branches:
      - master
      - stage
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  should-run:
    name: Skip push CI when a PR is open
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Decide whether to run CI
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(gh pr list --repo "${{ github.repository }}" \
            --head "${{ github.ref_name }}" --state open --json number --jq 'length')"
          if [[ "$count" -gt 0 ]]; then
            echo "Open PR exists for ${{ github.ref_name }}; skipping push CI"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build SDK
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build SDK
        run: ./gradlew --no-daemon clean build

      - name: Check dependency upgrades
        run: >-
          ./gradlew --no-daemon dependencyUpdates
          -Drevision=release
          -DgradleReleaseChannel=current
          -DoutputFormatter=html
          --no-parallel
          --warning-mode=all

      - name: Upload build reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          if-no-files-found: warn
          retention-days: 5
          path: |
            **/build/test-results/**/*.xml
            **/build/dependencyUpdates/*
            **/build/libs/**/*.jar
            **/build/distributions/*
            **/build/reports/**/*

  snyk:
    name: Scan dependencies with Snyk
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-22.04
    env:
      SNYK_TOKENS: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Scan dependencies with Snyk
        if: env.SNYK_TOKENS != ''
        run: ./gradlew --no-daemon snyk-test

  examples:
    name: Build examples
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JMS example
        run: mvn -B -Dstyle.color=never -f examples/jms -U clean install

      - name: Build Kafka example
        run: mvn -B -Dstyle.color=never -f examples/kafka clean install

      - name: Build Pulsar example
        run: mvn -B -Dstyle.color=never -f examples/pulsar clean install
